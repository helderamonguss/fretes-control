services:
  postgres:
    image: postgres:16-alpine
    container_name: fretes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fretes
      POSTGRES_PASSWORD: fretes
      POSTGRES_DB: fretes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
